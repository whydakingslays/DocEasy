<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocEasy Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
    <div id="navbar-container"></div>

    <main class="mx-auto w-full max-w-6xl px-4 py-8 sm:py-10">
        <section class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
            <h1 class="text-3xl font-extrabold tracking-tight">Your Files</h1>
            <p class="mt-2 text-sm text-slate-600">
                Download or delete uploaded and processed files.
            </p>
            <p id="dashboard-status" class="mt-3 min-h-5 text-sm text-slate-600"></p>
        </section>

        <section class="mt-6 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:p-6">
            <div id="file-history" class="grid gap-3"></div>
        </section>
    </main>

    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/dashboard.js"></script>
    <script type="module" src="components/navbar.js"></script>
    <script type="module" src="js/guard.js"></script>
</body>
</html>
