<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocEasy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
    <div id="navbar-container"></div>

    <div class="relative">
        <div class="pointer-events-none absolute inset-x-0 top-0 h-72 bg-gradient-to-b from-sky-100 to-transparent"></div>

        <main class="relative mx-auto w-full max-w-6xl px-4 py-10 sm:py-14">
            <section class="mx-auto max-w-3xl text-center">
                <h1 class="text-4xl font-extrabold tracking-tight sm:text-5xl">Process documents in one flow</h1>
                <p class="mt-3 text-base text-slate-600 sm:text-lg">
                    Upload once, run the selected tool, and download the processed file automatically.
                </p>
            </section>

            <section class="mx-auto mt-8 w-full max-w-2xl rounded-2xl border border-slate-200 bg-white p-6 shadow-xl sm:p-8">
                <div class="mb-4">
                    <h2 id="tool-title" class="text-2xl font-bold text-slate-900"></h2>
                    <p id="tool-description" class="mt-1 text-sm text-slate-600"></p>
                </div>
                <div id="tool-container" class="rounded-xl border border-slate-200 bg-slate-50 p-4 sm:p-5" aria-live="polite"></div>
            </section>
        </main>
    </div>

    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/tools.js"></script>
    <script type="module" src="js/ui.js"></script>
    <script type="module" src="components/navbar.js"></script>
    <script type="module" src="js/guard.js"></script>
</body>
</html>
