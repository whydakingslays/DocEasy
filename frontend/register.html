<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - DocEasy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
        <h1 class="text-3xl font-bold text-gray-900 text-center mb-6">Register</h1>
        <form id="register-form" class="space-y-4">
            <div>
                <label class="block text-sm text-gray-700">Username</label>
                <input id="username" type="text" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2" />
            </div>
            <div>
                <label class="block text-sm text-gray-700">Email</label>
                <input id="email" type="email" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2" />
            </div>
            <div>
                <label class="block text-sm text-gray-700">Password</label>
                <input id="password" type="password" minlength="8" required class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2" />
            </div>
            <button id="register-btn" type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">Register</button>
        </form>
        <p class="mt-4 text-center text-sm text-gray-600">Already have an account? <a href="login.html" class="text-blue-600">Login</a></p>
        <div id="status-message" class="mt-3 text-sm text-green-600 hidden text-center"></div>
        <div id="error-message" class="mt-3 text-sm text-red-600 hidden text-center"></div>
    </div>

    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
